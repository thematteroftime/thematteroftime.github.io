document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

section-label{font:12px ui-monospace,monospace;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;}\n  .gallery-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;}\n  .gallery-grid figure{margin:0;min-width:0;}\n  .gallery-grid img{width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;display:block;border-radius:3px;border:1px solid var(--line);}\n  .honors-section ul{padding-left:18px;line-height:2;font-size:14px;}\n  .honors-section li{margin:7px 0;}\n  .resume-link{max-width:1200px;margin:0 auto;padding:24px clamp(20px,5vw,64px);font-size:14px;}\n  .resume-link a{border-bottom:1px solid var(--accent);padding-bottom:4px;}\n  @media(max-width:700px){\n    .project-row{grid-template-columns:minmax(0,1fr) auto!important;gap:16px!important;}\n    .project-row>div:first-child{grid-column:1/-1;flex-direction:row!important;gap:14px!important;padding-left:0!important;}\n    .project-row>div:nth-child(2){grid-column:1;}\n    .project-row>div:last-child{grid-column:2;}\n    .gallery-grid{grid-template-columns:1fr;}\n    #top{gap:44px!important;}\n    #top>div:last-child{margin:0 auto;}\n    #top+section{grid-template-columns:1fr!important;}\n  }\n  @media(max-width:480px){\n    nav>div{flex-wrap:wrap;gap:14px!important;}\n    nav>div>span[title]{display:none;}\n    #research>div:last-child,#path{grid-template-columns:minmax(0,1fr)!important;}\n    #contact>a{font-size:clamp(22px,6.9vw,30px)!important;word-break:break-word;}\n    #path h4{font-size:16px!important;}\n    #path a>div:first-child,#path>div>div>div:first-child{flex-wrap:wrap;}\n  }\n\n<\/style>\n<\/helmet>\n\n<div ref=\"{{ rootRef }}\" style=\"--paper:#f1ece2; --ink:#2b2620; --muted:#8b8275; --faint:#b3aa9b; --line:rgba(44,38,32,.13); --card:rgba(44,38,32,.025); --accent:#b5563c; position:relative; min-height:100vh; background:var(--paper); color:var(--ink); font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; overflow-x:clip; transition:background .5s,color .5s;\">\n\n  \n\n  <canvas ref=\"{{ bgRef }}\" style=\"position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:0;\"><\/canvas>\n\n  <div style=\"position:relative; z-index:1;\">\n\n    <style>@media(max-width:600px){nav{flex-wrap:wrap} nav>div{gap:16px!important} [data-hud-t]{display:none} h1{overflow-wrap:anywhere}}<\/style><!-- NAV -->\n    <nav style=\"position:sticky; top:0; z-index:30; display:flex; align-items:center; justify-content:space-between; gap:20px; padding:18px clamp(20px,5vw,64px); background:color-mix(in srgb, var(--paper) 78%, transparent); backdrop-filter:blur(9px); border-bottom:1px solid var(--line);\">\n      <a href=\"#/\" aria-label=\"首页\" style=\"display:flex; align-items:baseline; gap:10px;\">\n        <span style=\"font-size:17px; font-weight:600; letter-spacing:-.01em;\">张杰栋<\/span>\n        <span style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:11px; letter-spacing:.14em; color:var(--muted);\">JIEDONG ZHANG<\/span>\n      <\/a>\n      <div style=\"display:flex; align-items:center; gap:clamp(14px,2vw,28px); font-size:13px;\">\n        <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n          <a href=\"#research\" data-nav=\"research\" style=\"border-bottom:1px solid transparent; padding-bottom:2px;\">研究<\/a>\n          <a href=\"#work\" data-nav=\"work\" style=\"border-bottom:1px solid transparent; padding-bottom:2px;\">项目<\/a>\n          <a href=\"#path\" data-nav=\"path\" style=\"border-bottom:1px solid transparent; padding-bottom:2px;\">经历<\/a>\n          <a href=\"#contact\" data-nav=\"contact\" style=\"border-bottom:1px solid transparent; padding-bottom:2px;\">联系<\/a>\n          <span title=\"scroll parameter t · current section\" style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:11px; letter-spacing:.04em; color:var(--muted); border:1px solid var(--line); border-radius:2px; padding:5px 9px; white-space:nowrap;\">t <span data-hud-t=\"\" style=\"color:var(--accent);\">0.000<\/span> · <span data-hud-sec=\"\" style=\"color:var(--accent);\">intro<\/span><\/span>\n        <\/sc-if>\n        <sc-if value=\"{{ isDetail }}\" hint-placeholder-val=\"{{ false }}\">\n          <a href=\"#/\" style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:12px; color:var(--muted);\">← 返回目录<\/a>\n        <\/sc-if>\n        <button class=\"language-switch\" onclick=\"{{ switchLanguage }}\" aria-label=\"Switch to English\" title=\"Switch to English\">EN<\/button>\n        <button onclick=\"{{ toggleTheme }}\" aria-label=\"切换明暗主题\" style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:11px; letter-spacing:.1em; color:var(--muted); background:none; border:1px solid var(--line); border-radius:2px; padding:5px 9px; cursor:pointer;\">◑<\/button>\n      <\/div>\n    <\/nav>\n\n    <!-- ============ HOME ============ -->\n    <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n    <main data-screen-label=\"Home\">\n      <!-- HERO -->\n      <header id=\"top\" style=\"scroll-margin-top:88px; padding:clamp(52px,8vw,112px) clamp(20px,5vw,64px) clamp(40px,6vw,72px); max-width:1200px; margin:0 auto; display:flex; flex-wrap:wrap; gap:clamp(32px,5vw,72px); align-items:center; justify-content:space-between;\">\n        <div style=\"flex:1 1 440px; min-width:0;\">\n          <div style=\"font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:clamp(11px,1.2vw,13px); letter-spacing:.2em; color:var(--accent); text-transform:uppercase; margin-bottom:clamp(20px,3vw,30px);\">运动规划 · 机器人学习 · 计算物理<\/div>\n          <h1 style=\"margin:0; font-size:clamp(50px,9vw,118px); line-height:.94; font-weight:600; letter-spacing:-.04em;\">张杰栋<\/h1>\n          <p style=\"margin:clamp(26px,4vw,40px) 0 0; font-size:clamp(19px,2.3vw,27px); line-height:1.5; letter-spacing:-.01em; max-width:600px; text-wrap:pretty;\">理解机器人的形状，也探索它能够走出的路径。<\/p>\n          <p style=\"margin:22px 0 0; font-size:16px; line-height:1.66; color:var(--muted); max-width:560px; text-wrap:pretty;\">我关注形状感知运动规划与机器人学习，本科就读于东华大学应用物理学，并在上海交通大学跨校辅修数学与应用数学。我喜欢从算法出发，连接硬件，再把想法放到真实机器人上验证。<\/p>\n          <div style=\"display:flex; align-items:flex-start; gap:12px; margin-top:26px; font-size:14px; color:var(--muted); max-width:560px;\">\n            <span style=\"width:8px; height:8px; border-radius:50%; background:var(--accent); flex:0 0 auto; margin-top:7px;\"><\/span>\n            <span>目前在上海交通大学工研院—物智进化，以及香港科技大学（广州）PAIRS 实验室开展机器人科研实习。<\/span>\n          <\/div>\n          <div style=\"display:flex; flex-wrap:wrap; gap:22px; margin-top:34px; font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:13px;\">\n            <a href=\"mailto:2107991398@qq.com\" data-mag=\"1\" style=\"display:inline-block; border-bottom:1px solid var(--line); padding-bottom:3px;\" style-hover=\"color:var(--accent); border-color:var(--accent);\">邮件联系 ↗<\/a>\n            <a href=\"https://github.com/thematteroftime\" target=\"_blank\" rel=\"noopener\" data-mag=\"1\" style=\"display:inline-block; border-bottom:1px solid var(--line); padding-bottom:3px;\" style-hover=\"color:var(--accent); border-color:var(--accent);\">GitHub ↗<\/a>\n            <a href=\"assets/Resume-Chinese.pdf\" target=\"_blank\" rel=\"noopener\" style=\"border-bottom:1px solid var(--line);padding-bottom:3px;\">中文简历 ↗<\/a>\n          <\/div>\n        <\/div>\n        <div style=\"position:relative; width:clamp(240px,34vw,380px); height:clamp(240px,34vw,380px); flex:0 0 auto;\">\n          <canvas ref=\"{{ heroRef }}\" style=\"position:absolute; inset:-38px; width:calc(100% + 76px); height:calc(100% + 76px); pointer-events:none;\"><\/canvas>\n          <div style=\"position:absolute; inset:0; border-radius:50%; overflow:hidden; border:1px solid var(--line);\">\n            <img src=\"assets/portrait-piano.jpg\" alt=\"张杰栋个人照片\" width=\"1440\" height=\"960\" fetchpriority=\"high\" decoding=\"async\" style=\"width:100%;height:100%;object-fit:cover;object-position:22% center;\">\n
